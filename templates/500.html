{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% trans "Erreur serveur" %} | V&V Swiss Services</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .error-container {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        .error-code {
            margin-bottom: 20px;
            font-size: clamp(90px, 18vw, 180px);
            font-weight: 700;
            line-height: .9;
            letter-spacing: -8px;
        }

        .error-title {
            margin: 0 0 20px;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.15;
        }

        .error-text {
            max-width: 570px;
            margin: 0 auto 35px;
            color: #666;
            font-size: 17px;
            line-height: 1.7;
        }

        .error-button {
            display: inline-block;
            padding: 15px 30px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: opacity .2s ease;
        }

        .error-button:hover {
            opacity: .8;
        }
    </style>
</head>

<body>

<main class="error-page">
    <div class="error-container">

        <div class="error-code">500</div>

        <h1 class="error-title">
            {% trans "Une erreur est survenue" %}
        </h1>

        <p class="error-text">
            {% trans "La page est momentanément indisponible. Veuillez réessayer dans quelques instants." %}
        </p>

        <a href="/{{ LANGUAGE_CODE|default:'fr' }}/" class="error-button">
            {% trans "Retour à l’accueil" %}
        </a>

    </div>
</main>

</body>
</html>
